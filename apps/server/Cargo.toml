[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dane-server"
path = "src/main.rs"

[dependencies]
domain.workspace = true
persistence.workspace = true
contracts.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
openidconnect.workspace = true
# No se usa directamente: activa "gzip" en el reqwest 0.12 que openidconnect/oauth2 usan por dentro (unificación de
# features de Cargo). Por qué: oauth.telegram.org a veces responde jwks.json comprimido con gzip aunque no se pida, y
# sin descompresión el descubrimiento OIDC falla con "Failed to parse server response" (login web caído al azar).
reqwest-oidc = { package = "reqwest", version = "0.12", default-features = false, features = ["gzip"] }
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
getrandom.workspace = true
aes-gcm.workspace = true
url.workspace = true
zip.workspace = true
regex.workspace = true
governor.workspace = true
ammonia.workspace = true
csv.workspace = true
async-trait.workspace = true
cookie.workspace = true

[dev-dependencies]
jsonwebtoken.workspace = true
wiremock.workspace = true
tower = { workspace = true, features = ["util"] }
